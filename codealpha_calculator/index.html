<!DOCTYPE html>
<html lang="en" data-theme="purple">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Modern, responsive, and feature-rich Calculator web application built with HTML5, CSS3, and Vanilla JavaScript for CodeAlpha Web Development Internship Task 2.">
  <title> Rakz's Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="app-wrapper">
    <!-- Background Ambient Glows -->
    <div class="glow-sphere glow-1" aria-hidden="true"></div>
    <div class="glow-sphere glow-2" aria-hidden="true"></div>

    <main class="calculator-card" role="region" aria-label="Calculator">
      <!-- Calculator Header -->
      <header class="calculator-header">
        <div class="brand">
          <div class="brand-badge">
            <span class="brand-dot"></span>
            <span class="brand-code">solve and enjoy</span>
          </div>
          <h1 class="brand-title">Rakz's Calculator</h1>
        </div>

        <div class="header-actions">
          <button id="theme-btn" class="theme-toggle-btn" aria-haspopup="dialog" aria-expanded="false"
            aria-label="Open Theme Palette" title="Change Theme">
            <svg class="theme-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <path
                d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z">
              </path>
              <line x1="9" y1="21" x2="15" y2="21"></line>
            </svg>
            <span class="theme-btn-label">Theme</span>
          </button>
        </div>
      </header>

      <!-- Theme Selector Dropdown/Modal -->
      <div id="theme-modal" class="theme-selector-popover" role="dialog" aria-modal="true" aria-label="Theme Selection"
        hidden>
        <div class="theme-selector-header">
          <div class="theme-selector-title">Select Color Theme</div>
          <button id="theme-close-btn" class="theme-close-btn" aria-label="Close Theme Selector" title="Close">
            &times;
          </button>
        </div>
        <div class="theme-options-grid" role="radiogroup" aria-label="Color Themes">
          <button type="button" class="theme-option active" data-theme-id="purple" role="radio" aria-checked="true">
            <span class="theme-color-swatch swatch-purple"></span>
            <span class="theme-name">Purple</span>
            <span class="active-indicator" aria-hidden="true">✓</span>
          </button>
          <button type="button" class="theme-option" data-theme-id="blue" role="radio" aria-checked="false">
            <span class="theme-color-swatch swatch-blue"></span>
            <span class="theme-name">Blue</span>
            <span class="active-indicator" aria-hidden="true">✓</span>
          </button>
          <button type="button" class="theme-option" data-theme-id="pink" role="radio" aria-checked="false">
            <span class="theme-color-swatch swatch-pink"></span>
            <span class="theme-name">Pink</span>
            <span class="active-indicator" aria-hidden="true">✓</span>
          </button>
          <button type="button" class="theme-option" data-theme-id="green" role="radio" aria-checked="false">
            <span class="theme-color-swatch swatch-green"></span>
            <span class="theme-name">Green</span>
            <span class="active-indicator" aria-hidden="true">✓</span>
          </button>
          <button type="button" class="theme-option" data-theme-id="dark" role="radio" aria-checked="false">
            <span class="theme-color-swatch swatch-dark"></span>
            <span class="theme-name">Dark</span>
            <span class="active-indicator" aria-hidden="true">✓</span>
          </button>
          <button type="button" class="theme-option" data-theme-id="light" role="radio" aria-checked="false">
            <span class="theme-color-swatch swatch-light"></span>
            <span class="theme-name">Light</span>
            <span class="active-indicator" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>

      <!-- Display Screen Area -->
      <section class="calculator-display" aria-live="polite" aria-atomic="true">
        <div id="previous-operand" class="previous-operand" title="Previous calculation history">&nbsp;</div>
        <div id="current-operand" class="current-operand" title="Current input or result">0</div>
      </section>

      <!-- Calculator Keypad Grid -->
      <section class="calculator-keypad" aria-label="Calculator Keypad">
        <!-- Row 1: Special Actions & Top Operators -->
        <button type="button" id="btn-clear" class="calc-btn btn-special btn-clear" data-action="clear"
          aria-label="Clear All" title="Clear (Escape)">
          <span>C</span>
        </button>
        <button type="button" id="btn-delete" class="calc-btn btn-special btn-delete" data-action="delete"
          aria-label="Delete last digit" title="Backspace (Backspace)">
          <span>⌫</span>
        </button>
        <button type="button" id="btn-divide" class="calc-btn btn-operator" data-operation="÷" data-key="/"
          aria-label="Divide" title="Divide (/)">
          <span>÷</span>
        </button>
        <button type="button" id="btn-multiply" class="calc-btn btn-operator" data-operation="×" data-key="*"
          aria-label="Multiply" title="Multiply (*)">
          <span>×</span>
        </button>

        <!-- Row 2: 7, 8, 9, Subtraction -->
        <button type="button" id="btn-7" class="calc-btn btn-number" data-number="7" aria-label="7">7</button>
        <button type="button" id="btn-8" class="calc-btn btn-number" data-number="8" aria-label="8">8</button>
        <button type="button" id="btn-9" class="calc-btn btn-number" data-number="9" aria-label="9">9</button>
        <button type="button" id="btn-subtract" class="calc-btn btn-operator" data-operation="−" data-key="-"
          aria-label="Subtract" title="Subtract (-)">
          <span>−</span>
        </button>

        <!-- Row 3: 4, 5, 6, Addition -->
        <button type="button" id="btn-4" class="calc-btn btn-number" data-number="4" aria-label="4">4</button>
        <button type="button" id="btn-5" class="calc-btn btn-number" data-number="5" aria-label="5">5</button>
        <button type="button" id="btn-6" class="calc-btn btn-number" data-number="6" aria-label="6">6</button>
        <button type="button" id="btn-add" class="calc-btn btn-operator" data-operation="+" data-key="+"
          aria-label="Add" title="Add (+)">
          <span>+</span>
        </button>

        <!-- Row 4 & 5: Numbers, Decimal & Equals (Span layout) -->
        <button type="button" id="btn-1" class="calc-btn btn-number" data-number="1" aria-label="1">1</button>
        <button type="button" id="btn-2" class="calc-btn btn-number" data-number="2" aria-label="2">2</button>
        <button type="button" id="btn-3" class="calc-btn btn-number" data-number="3" aria-label="3">3</button>
        <button type="button" id="btn-equals" class="calc-btn btn-equals" data-action="calculate" aria-label="Equals"
          title="Calculate (Enter or =)">
          <span>=</span>
        </button>

        <!-- Row 5: 0 & Decimal -->
        <button type="button" id="btn-0" class="calc-btn btn-number btn-zero" data-number="0" aria-label="0">0</button>
        <button type="button" id="btn-decimal" class="calc-btn btn-number btn-decimal" data-number="."
          aria-label="Decimal point" title="Decimal (.)">.</button>
      </section>

      <!-- Footer Info -->
      <footer class="calculator-footer">
        <span>Rakzana's calculator for development</span>
        <span class="dot-separator">•</span>
        <span>Developer: Rakzana</span>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
